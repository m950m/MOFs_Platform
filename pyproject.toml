[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mofs-platform"
version = "0.1.0"
description = "Evidence-traceable research tool for MOF-related electrochemistry (HER/OER)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Mohammed", email = "nabilmuhammed950@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.64.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
